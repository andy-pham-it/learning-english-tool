<style>
.flashcard-container {
  perspective: 1200px;
}

.flashcard-inner {
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.is-flipped {
  transform: rotateY(180deg);
}

.flashcard-front,
.flashcard-back {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden; /* Safari */
}

.flashcard-back {
  transform: rotateY(180deg);
}

/* Styling for grading buttons */
.grade-btn {
  @apply py-3 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 shadow-sm font-bold;
}

.grade-btn:active {
  transform: scale(0.92);
}
</style>

<div class="flashcard-container group w-full max-w-sm mx-auto h-[480px] cursor-pointer" (click)="flip()">
  
  <div class="flashcard-inner w-full h-full relative" [class.is-flipped]="isFlipped">
    
    <!-- FRONT SIDE -->
    <div class="flashcard-front absolute w-full h-full rounded-3xl p-8 flex flex-col justify-center items-center text-center shadow-lg border border-slate-100 bg-white">
      
      <div class="category-badge absolute top-6 px-4 py-1.5 rounded-full text-[10px] font-bold tracking-widest text-indigo-600 bg-indigo-50 border border-indigo-100 uppercase">
        {{ card.category }}
      </div>
      
      <h2 class="text-4xl font-black text-slate-800 mb-2">
        {{ card.word }}
      </h2>
      <p class="text-lg text-slate-400 mb-8 font-medium italic">
        /{{ card.phonetic }}/
      </p>
      
      <div class="absolute bottom-10 animate-bounce text-slate-300 flex flex-col items-center">
        <span class="text-[10px] font-black uppercase tracking-[0.2em] mb-2">Tap to Flip</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
        </svg>
      </div>
      
    </div>

    <!-- BACK SIDE -->
    <div class="flashcard-back absolute w-full h-full rounded-3xl p-8 flex flex-col items-center shadow-lg border border-slate-100 bg-white">
      
      <div class="flex-grow flex flex-col justify-center items-center w-full mt-4 text-center">
        <h3 class="text-2xl font-bold text-slate-700 mb-6">
          {{ card.meaning }}
        </h3>
        
        <div class="w-full bg-slate-50 rounded-2xl p-6 border border-slate-100">
          <p class="text-[15px] leading-relaxed text-slate-600 italic mb-3">
            "{{ card.example }}"
          </p>
          <p *ngIf="card.exampleTranslation" class="text-[13px] leading-relaxed text-indigo-500 font-medium border-t border-slate-200/60 pt-3">
            {{ card.exampleTranslation }}
          </p>
        </div>
      </div>
      
      <!-- Grading Buttons (SM-2) -->
      <div class="w-full grid grid-cols-4 gap-2 mt-8 pb-2" *ngIf="isFlipped">
        <button (click)="gradeCard(0, $event)" class="grade-btn bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-100">
          <span class="block text-[11px] font-black uppercase tracking-tighter">Again</span>
          <span class="block text-[9px] opacity-60">&lt; 1m</span>
        </button>
        <button (click)="gradeCard(3, $event)" class="grade-btn bg-amber-50 text-amber-600 border border-amber-100 hover:bg-amber-100">
          <span class="block text-[11px] font-black uppercase tracking-tighter">Hard</span>
          <span class="block text-[9px] opacity-60">~ 6d</span>
        </button>
        <button (click)="gradeCard(4, $event)" class="grade-btn bg-emerald-50 text-emerald-600 border border-emerald-100 hover:bg-emerald-100">
          <span class="block text-[11px] font-black uppercase tracking-tighter">Good</span>
          <span class="block text-[9px] opacity-60">~ 12d</span>
        </button>
        <button (click)="gradeCard(5, $event)" class="grade-btn bg-indigo-50 text-indigo-600 border border-indigo-100 hover:bg-indigo-100">
          <span class="block text-[11px] font-black uppercase tracking-tighter">Easy</span>
          <span class="block text-[9px] opacity-60">~ 20d</span>
        </button>
      </div>

    </div>
    
  </div>
</div>
